<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شارك</title>
<style>
  :root {
    --night: #0A1328;
    --deep: #101E3C;
    --raise: #162850;
    --line: #233661;
    --mint: #4FD1A5;
    --mint-ink: #05261B;
    --glow: #7CF5CF;
    --amber: #FFC857;
    --coral: #FF7A7A;
    --text: #F2F6FC;
    --mist: #9DB3D1;
    --dim: #647A9E;
    --screen: #050B18;
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(0,0,0,.35);
    --font: "Segoe UI Variable Text", "Segoe UI", Tahoma, sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI", Tahoma, sans-serif;
    --mono: "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --night: #E9EFF8; --deep: #FFFFFF; --raise: #F3F7FD; --line: #D5DFEE;
      --mint: #17A375; --mint-ink: #FFFFFF; --glow: #2ED39C; --amber: #C98A00; --coral: #D94848;
      --text: #0B1F3A; --mist: #4A6283; --dim: #7B8FAD; --screen: #0B1630;
      --shadow: 0 1px 2px rgba(11,31,58,.06), 0 8px 24px rgba(11,31,58,.08);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --night: #E9EFF8; --deep: #FFFFFF; --raise: #F3F7FD; --line: #D5DFEE;
    --mint: #17A375; --mint-ink: #FFFFFF; --glow: #2ED39C; --amber: #C98A00; --coral: #D94848;
    --text: #0B1F3A; --mist: #4A6283; --dim: #7B8FAD; --screen: #0B1630;
    --shadow: 0 1px 2px rgba(11,31,58,.06), 0 8px 24px rgba(11,31,58,.08);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--night);
    color: var(--text);
    font: 14px/1.5 var(--font);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }

  .app { position: relative; height: 100vh; display: flex; flex-direction: column; isolation: isolate; }

  /* Ambient light: the room glows when the TV is showing your screen. */
  .ambient {
    position: absolute; inset: -20% -30% auto; height: 70%;
    background: radial-gradient(60% 55% at 50% 40%, color-mix(in srgb, var(--glow) 38%, transparent), transparent 70%);
    opacity: 0; transition: opacity .8s ease; z-index: -1; pointer-events: none; filter: blur(10px);
  }
  .app[data-state="streaming"] .ambient { opacity: .55; animation: breathe 6s ease-in-out infinite; }
  .app[data-state="waiting_approval"] .ambient {
    opacity: .35;
    background: radial-gradient(60% 55% at 50% 40%, color-mix(in srgb, var(--amber) 40%, transparent), transparent 70%);
  }
  @keyframes breathe { 50% { opacity: .38; } }

  /* ---------- title bar ---------- */
  .titlebar {
    height: 42px; flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 14px 0 6px;
  }
  .brand { display: flex; align-items: center; gap: 9px; flex: 1; }
  .mark { width: 24px; height: 24px; flex: none; }
  .brand b { font: 700 16px/1 var(--display); letter-spacing: -.2px; }
  .winbtn {
    width: 34px; height: 30px; border: 0; border-radius: 8px; background: transparent;
    display: grid; place-items: center; color: var(--mist);
  }
  .winbtn:hover { background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text); }
  .winbtn.close:hover { background: var(--coral); color: #fff; }
  .winbtn svg { width: 14px; height: 14px; }

  /* ---------- hero: a small twin of the real TV ---------- */
  .hero { flex: none; padding: 4px 22px 0; }
  .tv { position: relative; width: 100%; max-width: 236px; margin: 0 auto; }
  .bezel {
    position: relative; aspect-ratio: 16 / 9; border-radius: 10px; padding: 5px;
    background: linear-gradient(180deg, #1E2A44, #0D1426);
    box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 18px 40px -12px rgba(0,0,0,.6);
  }
  .screen {
    position: absolute; inset: 5px; border-radius: 6px; overflow: hidden; background: var(--screen);
    display: grid; place-items: center; text-align: center; color: #DCE6F5;
  }
  .stand { width: 34%; height: 9px; margin: 0 auto; background: linear-gradient(#1A253D, #0E1628);
    clip-path: polygon(12% 0, 88% 0, 100% 100%, 0 100%); }
  .app[data-state="streaming"] .bezel {
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 0 60px -6px color-mix(in srgb, var(--glow) 55%, transparent),
                0 18px 40px -12px rgba(0,0,0,.6);
  }
  .layer { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .35s ease; }
  .app[data-state="idle"] .l-idle,
  .app[data-state="connecting"] .l-connecting,
  .app[data-state="waiting_approval"] .l-approval,
  .app[data-state="streaming"] .l-stream,
  .app[data-state="rejected"] .l-error,
  .app[data-state="error"] .l-error { opacity: 1; }

  .l-idle .tvname { font: 600 13px/1.3 var(--display); color: #C9D6EA; padding: 0 16px; }
  .l-idle .standby { margin-top: 6px; font-size: 11px; color: #6E84A8; display: flex; gap: 6px; align-items: center; justify-content: center; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 8px var(--mint); }

  .scanline { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 0, rgba(124,245,207,.18) 48%, transparent 52%);
    background-size: 100% 220%; animation: scan 1.6s linear infinite; }
  @keyframes scan { from { background-position: 0 120%; } to { background-position: 0 -120%; } }
  .l-connecting span { position: relative; font-size: 12px; color: #BFD0E8; }

  .prompt {
    width: 62%; padding: 9px 10px 10px; border-radius: 8px; background: #13284B; border: 1px solid rgba(255,255,255,.12);
    font-size: 10px; color: #B9C9E2;
  }
  .prompt b { display: block; color: #fff; font: 700 12px/1.3 var(--display); margin: 2px 0 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prompt .btns { display: flex; gap: 5px; justify-content: center; }
  .prompt i { font-style: normal; font-size: 9px; padding: 3px 8px; border-radius: 5px; background: rgba(255,255,255,.1); }
  .prompt i.ok { background: var(--mint); color: #05261B; font-weight: 700; box-shadow: 0 0 0 2px #fff; animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: scale(1.12); } }

  .aurora { position: absolute; inset: -40%; background:
      radial-gradient(35% 30% at 30% 40%, rgba(79,209,165,.75), transparent 70%),
      radial-gradient(30% 35% at 70% 60%, rgba(70,120,255,.65), transparent 70%),
      radial-gradient(25% 25% at 55% 30%, rgba(255,200,87,.35), transparent 70%);
    animation: drift 9s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(6%, -4%) rotate(14deg) scale(1.08); } }
  .live { position: absolute; top: 8px; inset-inline-start: 8px; display: flex; align-items: center; gap: 5px;
    font: 700 10px/1 var(--mono); letter-spacing: .5px; color: #fff; background: rgba(0,0,0,.35); padding: 4px 7px; border-radius: 20px; }
  .live .dot { background: #FF5A5A; box-shadow: 0 0 8px #FF5A5A; animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .l-error svg { width: 30px; height: 30px; color: var(--coral); }

  .caption { text-align: center; margin: 10px 0 0; }
  .caption h1 { margin: 0; font: 700 20px/1.25 var(--display); letter-spacing: -.3px; }
  .caption p { margin: 3px 0 0; color: var(--mist); font-size: 13px; min-height: 20px; }

  /* ---------- body ---------- */
  .body { flex: 1; overflow-y: auto; padding: 10px 18px 8px; scrollbar-width: thin; }
  .body::-webkit-scrollbar { width: 6px; }
  .body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .view { display: none; }
  .app[data-state="idle"] .v-pick,
  .app[data-state="connecting"] .v-wait,
  .app[data-state="waiting_approval"] .v-wait,
  .app[data-state="streaming"] .v-stream,
  .app[data-state="rejected"] .v-error,
  .app[data-state="error"] .v-error { display: block; animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  .sechead { display: flex; align-items: center; justify-content: space-between; margin: 4px 2px 8px; }
  .sechead h2 { margin: 0; font: 600 12px/1 var(--font); color: var(--mist); letter-spacing: .2px; }
  .scan { border: 0; background: transparent; color: var(--mist); display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 6px; border-radius: 8px; }
  .scan:hover { color: var(--text); background: color-mix(in srgb, var(--text) 6%, transparent); }
  .scan svg { width: 14px; height: 14px; }
  .scan.busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(-360deg); } }

  .tvs { display: grid; gap: 8px; }
  .tvcard {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: start;
    padding: 11px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--deep);
    box-shadow: var(--shadow); transition: border-color .15s, transform .15s, background .15s;
  }
  .tvcard:hover { transform: translateY(-1px); }
  .tvcard[aria-checked="true"] { border-color: var(--mint); background: color-mix(in srgb, var(--mint) 9%, var(--deep)); }
  .tvicon { width: 42px; height: 30px; flex: none; color: var(--mist); }
  .tvcard[aria-checked="true"] .tvicon { color: var(--mint); }
  .tvmeta { flex: 1; min-width: 0; }
  .tvmeta b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tvmeta small { color: var(--dim); font: 12px/1.3 var(--mono); direction: ltr; unicode-bidi: isolate; }
  .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
  .tvcard[aria-checked="true"] .radio { border-color: var(--mint); }
  .tvcard[aria-checked="true"] .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); }

  .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 16px 14px; color: var(--mist); font-size: 13px; text-align: center; }
  .empty b { display: block; color: var(--text); font-weight: 600; margin-bottom: 2px; }

  .manual { margin-top: 8px; }
  .linkbtn { border: 0; background: none; color: var(--mist); font-size: 12px; padding: 4px 2px; display: inline-flex; gap: 5px; align-items: center; }
  .linkbtn:hover { color: var(--text); }
  .ipfield { display: none; margin-top: 6px; }
  .manual.open .ipfield { display: block; }
  .ipfield input {
    width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--deep);
    font-family: var(--mono); direction: ltr; text-align: left; outline: none; user-select: text;
  }
  .ipfield input:focus { border-color: var(--mint); }

  details.settings { margin-top: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--deep); box-shadow: var(--shadow); }
  details.settings summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 11px 14px; cursor: pointer; color: var(--mist); font-weight: 600; font-size: 13px; }
  details.settings summary::-webkit-details-marker { display: none; }
  details.settings summary .chev { margin-inline-start: auto; width: 14px; height: 14px; transition: transform .2s; }
  details.settings[open] summary .chev { transform: rotate(180deg); }
  details.settings summary .sum { margin-inline-start: auto; font: 11px/1 var(--mono); color: var(--dim); direction: ltr; }
  details.settings[open] summary .sum { display: none; }
  .rows { padding: 2px 14px 12px; display: grid; gap: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .row > span { color: var(--mist); font-size: 13px; white-space: nowrap; }

  .seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--raise); border: 1px solid var(--line); gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 8px; font-size: 12.5px; color: var(--mist); white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--mint); color: var(--mint-ink); font-weight: 700; }
  .seg[aria-disabled="true"] { opacity: .45; pointer-events: none; }

  /* streaming view */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { padding: 10px 8px; border-radius: 12px; background: var(--deep); border: 1px solid var(--line); text-align: center; box-shadow: var(--shadow); }
  .stat b { display: block; font: 700 18px/1.2 var(--mono); direction: ltr; }
  .stat small { color: var(--dim); font-size: 11px; }
  .panel { border: 1px solid var(--line); border-radius: 14px; background: var(--deep); padding: 12px 14px; display: grid; gap: 10px; box-shadow: var(--shadow); }

  .waitcopy, .errcopy { text-align: center; color: var(--mist); font-size: 13px; padding: 6px 10px 0; }
  .errcopy b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }

  /* ---------- footer ---------- */
  .footer { flex: none; padding: 8px 18px 14px; }
  .primary {
    width: 100%; height: 50px; border: 0; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--mint); color: var(--mint-ink); font: 700 16px/1 var(--display);
    box-shadow: 0 10px 24px -10px color-mix(in srgb, var(--mint) 80%, transparent);
    transition: transform .12s, filter .12s, background .2s;
  }
  .primary svg { width: 20px; height: 20px; }
  .primary:hover { filter: brightness(1.06); }
  .primary:active { transform: scale(.985); }
  .primary:disabled { background: var(--raise); color: var(--dim); box-shadow: none; cursor: default; filter: none; }
  .primary.stop { background: color-mix(in srgb, var(--coral) 16%, var(--deep)); color: var(--coral); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--coral) 60%, transparent); }
  .primary.quiet { background: var(--raise); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .hint { margin-top: 8px; text-align: center; font-size: 11.5px; color: var(--dim); }
  kbd { font: 11px/1 var(--mono); padding: 2px 5px; border-radius: 5px; border: 1px solid var(--line); background: var(--deep); color: var(--mist); direction: ltr; display: inline-block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app" id="app" data-state="idle">
  <div class="ambient"></div>

  <header class="titlebar pywebview-drag-region">
    <div class="brand pywebview-drag-region">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6BE3BC"/><stop offset="1" stop-color="#2FB287"/></linearGradient></defs>
        <rect width="24" height="24" rx="6.5" fill="url(#g)"/>
        <g fill="none" stroke="#06101F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5.3" y="6.6" width="13.4" height="8.6" rx="1.4"/><path d="M9.4 18.3h5.2"/>
          <path d="M10.3 12.6a2.4 2.4 0 0 1 3.4 0M8.9 11.1a4.4 4.4 0 0 1 6.2 0"/>
        </g>
      </svg>
      <b>شارك</b>
    </div>
    <button class="winbtn" id="btnMin" title="تصغير" aria-label="تصغير">
      <svg viewBox="0 0 14 14"><path d="M2 7h10" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button class="winbtn close" id="btnClose" title="إخفاء جنب الساعة" aria-label="إخفاء">
      <svg viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </header>

  <section class="hero">
    <div class="tv" aria-hidden="true">
      <div class="bezel">
        <div class="screen">
          <div class="layer l-idle"><div><div class="tvname" id="heroName">اختر تلفزيون</div>
            <div class="standby"><span class="dot"></span><span>جاهز للعرض</span></div></div></div>
          <div class="layer l-connecting"><div class="scanline"></div><span>يتصل…</span></div>
          <div class="layer l-approval"><div class="prompt">طلب عرض<b id="heroDevice">«جهازك»</b>
            <div class="btns"><i class="ok">موافق</i><i>رفض</i></div></div></div>
          <div class="layer l-stream"><div class="aurora"></div><div class="live"><span class="dot"></span>LIVE</div></div>
          <div class="layer l-error"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg></div>
        </div>
      </div>
      <div class="stand"></div>
    </div>
    <div class="caption">
      <h1 id="headline">وين تبي تعرض شاشتك؟</h1>
      <p id="subline">اختر التلفزيون واضغط «ابدأ المشاركة»</p>
    </div>
  </section>

  <main class="body">
    <!-- pick a TV -->
    <div class="view v-pick">
      <div class="sechead">
        <h2>التلفزيونات على شبكتك</h2>
        <button class="scan" id="btnScan" title="بحث مرة ثانية">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/></svg>
          <span id="scanLabel">بحث</span>
        </button>
      </div>
      <div class="tvs" id="tvs" role="radiogroup" aria-label="التلفزيونات"></div>

      <div class="manual" id="manual">
        <button class="linkbtn" id="btnManual">
          <svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          اتصال بعنوان IP
        </button>
        <div class="ipfield"><input id="ip" inputmode="decimal" placeholder="192.168.1.20" spellcheck="false" aria-label="عنوان IP للتلفزيون"></div>
      </div>

      <details class="settings" id="settings">
        <summary>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          الإعدادات
          <span class="sum" id="settingsSum"></span>
          <svg class="chev" viewBox="0 0 14 14"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </summary>
        <div class="rows">
          <div class="row"><span>الدقة</span>
            <div class="seg" data-key="res"><button data-v="720p">720p</button><button data-v="1080p">1080p</button><button data-v="native">الأصلية</button></div></div>
          <div class="row"><span>الإطارات</span>
            <div class="seg" data-key="fps" data-type="int"><button data-v="30">30</button><button data-v="60">60</button></div></div>
          <div class="row"><span>الجودة</span>
            <div class="seg" data-key="quality"><button data-v="medium">متوسطة</button><button data-v="high">عالية</button><button data-v="max">عالية جداً</button></div></div>
          <div class="row"><span>شكل الصورة</span>
            <div class="seg" data-key="fill" data-type="bool"><button data-v="true">ملء الشاشة</button><button data-v="false">بحواف</button></div></div>
          <div class="row"><span>الصوت يطلع من</span>
            <div class="seg" data-key="audio_mode" data-live="1"><button data-v="tv">التلفزيون</button><button data-v="laptop">الكمبيوتر</button><button data-v="both">الاثنين</button></div></div>
        </div>
      </details>
    </div>

    <!-- connecting / waiting for the TV -->
    <div class="view v-wait"><p class="waitcopy" id="waitCopy"></p></div>

    <!-- streaming -->
    <div class="view v-stream">
      <div class="stats">
        <div class="stat"><b id="sFps">0</b><small>إطار/ثانية</small></div>
        <div class="stat"><b id="sMbps">0</b><small>ميغابت/ثانية</small></div>
        <div class="stat"><b id="sEnc">—</b><small>الضغط</small></div>
      </div>
      <div class="panel">
        <div class="row"><span>الصوت يطلع من</span>
          <div class="seg" data-key="audio_mode" data-live="1"><button data-v="tv">التلفزيون</button><button data-v="laptop">الكمبيوتر</button><button data-v="both">الاثنين</button></div></div>
      </div>
    </div>

    <!-- rejected / error -->
    <div class="view v-error"><p class="errcopy"><b id="errTitle"></b><span id="errText"></span></p></div>
  </main>

  <footer class="footer">
    <button class="primary" id="primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span id="primaryLabel">ابدأ المشاركة</span>
    </button>
    <div class="hint" id="hint">أو اضغط <kbd id="hotkey">Ctrl+Alt+S</kbd> من أي مكان</div>
  </footer>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const app = $("app");
  let api = null;
  let st = null;
  let selected = null;
  let tvsKey = "";

  const params = new URLSearchParams(location.search);
  if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");

  const TV_ICON = '<svg class="tvicon" viewBox="0 0 42 30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2" y="2" width="38" height="21" rx="3"/><path d="M15 28h12M21 23v5" stroke-linecap="round"/></svg>';
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function tvName(ip) {
    const t = (st?.tvs || []).find((x) => x.ip === ip);
    return t ? t.name : ip;
  }

  function target() {
    const manual = $("ip").value.trim();
    if ($("manual").classList.contains("open") && manual) return manual;
    return selected;
  }

  function renderTvs() {
    const key = JSON.stringify(st.tvs) + "|" + selected;
    if (key === tvsKey) return;
    tvsKey = key;
    const box = $("tvs");
    if (!st.tvs.length) {
      box.innerHTML = st.searching
        ? '<div class="empty"><b>نبحث عن تلفزيونات…</b>تأكد إن التلفزيون شغال</div>'
        : '<div class="empty"><b>ما لقينا تلفزيون</b>افتح تطبيق شارك على التلفزيون، وتأكد إنه على نفس الواي فاي</div>';
      return;
    }
    box.innerHTML = st.tvs.map((t) => `
      <button class="tvcard" role="radio" aria-checked="${t.ip === selected}" data-ip="${esc(t.ip)}">
        ${TV_ICON}
        <span class="tvmeta"><b>${esc(t.name)}</b><small>${esc(t.ip)}</small></span>
        <span class="radio"></span>
      </button>`).join("");
  }

  function renderSegs() {
    document.querySelectorAll(".seg").forEach((seg) => {
      const v = String(st.settings[seg.dataset.key]);
      seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
      const locked = !seg.dataset.live && st.status.state !== "idle";
      seg.setAttribute("aria-disabled", String(locked));
    });
    const s = st.settings;
    $("settingsSum").textContent = `${s.res === "native" ? "native" : s.res} · ${s.fps}fps`;
  }

  function render() {
    if (!st) return;
    const state = st.status.state || "idle";
    app.dataset.state = state;

    if (!selected || (st.tvs.length && !st.tvs.some((t) => t.ip === selected))) {
      const last = st.settings.last_tv;
      selected = st.tvs.some((t) => t.ip === last) ? last : (st.tvs[0]?.ip || null);
    }
    renderTvs();
    renderSegs();
    $("btnScan").classList.toggle("busy", !!st.searching);
    $("scanLabel").textContent = st.searching ? "يبحث…" : "بحث";
    $("hotkey").textContent = st.hotkey || "Ctrl+Alt+S";
    $("heroName").textContent = selected ? tvName(selected) : (target() || "اختر تلفزيون");
    $("heroDevice").textContent = "«" + (st.device_name || "جهازك") + "»";

    const tv = st.status.tv_name || tvName(target());
    const H = $("headline"), P = $("subline"), btn = $("primary"), label = $("primaryLabel");
    btn.className = "primary";
    btn.disabled = false;
    $("hint").style.visibility = "visible";

    if (state === "idle") {
      H.textContent = "وين تبي تعرض شاشتك؟";
      P.textContent = target() ? `على «${tvName(target())}»` : "اختر التلفزيون واضغط «ابدأ المشاركة»";
      label.textContent = "ابدأ المشاركة";
      btn.disabled = !target();
    } else if (state === "connecting") {
      H.textContent = "نتصل بالتلفزيون…";
      P.textContent = tv;
      $("waitCopy").textContent = "";
      label.textContent = "إلغاء";
      btn.className = "primary quiet";
    } else if (state === "waiting_approval") {
      H.textContent = "وافق من التلفزيون";
      P.textContent = `اضغط «موافق» على «${tv}» بالريموت`;
      $("waitCopy").textContent = "ينتظر الطلب دقيقة، وبعدها يُرفض تلقائياً.";
      label.textContent = "إلغاء";
      btn.className = "primary quiet";
    } else if (state === "streaming") {
      H.textContent = "شاشتك على التلفزيون";
      P.textContent = tv;
      $("sFps").textContent = Math.round(st.status.fps || 0);
      $("sMbps").textContent = (st.status.mbps || 0).toFixed(1);
      $("sEnc").textContent = (st.status.encoder || "—").replace("h264_", "").toUpperCase();
      label.textContent = "إيقاف المشاركة";
      btn.className = "primary stop";
    } else {
      const rejected = state === "rejected";
      H.textContent = rejected ? "التلفزيون رفض الطلب" : "ما تمت المشاركة";
      P.textContent = tv || "";
      $("errTitle").textContent = rejected ? "انرفض الطلب من التلفزيون" : (st.status.message || "صار خطأ");
      $("errText").textContent = rejected
        ? "إذا كان بالغلط، جرّب مرة ثانية واختر «موافق» على التلفزيون."
        : "تأكد إن تطبيق شارك مفتوح على التلفزيون وإن الجهازين على نفس الواي فاي.";
      label.textContent = "رجوع";
      btn.className = "primary quiet";
      $("hint").style.visibility = "hidden";
    }
  }

  // ---------- events ----------
  $("tvs").addEventListener("click", (e) => {
    const card = e.target.closest(".tvcard");
    if (!card) return;
    selected = card.dataset.ip;
    $("manual").classList.remove("open");
    api.set_setting("last_tv", selected);
    render();
  });
  $("tvs").addEventListener("keydown", (e) => {
    if (!["ArrowDown", "ArrowUp"].includes(e.key)) return;
    const cards = [...document.querySelectorAll(".tvcard")];
    const i = cards.indexOf(document.activeElement);
    const next = cards[(i + (e.key === "ArrowDown" ? 1 : -1) + cards.length) % cards.length];
    next?.focus(); next?.click(); e.preventDefault();
  });
  document.querySelectorAll(".seg").forEach((seg) => seg.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    let v = b.dataset.v;
    if (seg.dataset.type === "int") v = parseInt(v, 10);
    if (seg.dataset.type === "bool") v = v === "true";
    st.settings[seg.dataset.key] = v;
    renderSegs();
    api.set_setting(seg.dataset.key, v);
  }));
  $("btnManual").addEventListener("click", () => {
    const m = $("manual");
    m.classList.toggle("open");
    if (m.classList.contains("open")) $("ip").focus();
    render();
  });
  $("ip").addEventListener("input", () => { api.set_setting("manual_ip", $("ip").value.trim()); render(); });
  $("ip").addEventListener("keydown", (e) => { if (e.key === "Enter" && target()) $("primary").click(); });
  $("btnScan").addEventListener("click", () => api.search());
  $("btnMin").addEventListener("click", () => api.minimize());
  $("btnClose").addEventListener("click", () => api.hide());
  $("primary").addEventListener("click", () => {
    const s = st.status.state;
    if (s === "idle") { const t = target(); if (t) api.start(t); }
    else if (s === "rejected" || s === "error") api.reset();
    else api.stop();
  });

  window.sharek = { onState(next) { st = next; render(); } };

  async function boot(a) {
    api = a;
    st = await api.get_state();
    if (st.settings.manual_ip) $("ip").value = st.settings.manual_ip;
    render();
  }

  // ---------- browser preview: a mock of the Python side ----------
  function mockApi() {
    const tvs = [{ name: "تلفزيون الصالة", ip: "192.168.1.50" }, { name: "تلفزيون المجلس", ip: "192.168.1.51" }];
    const m = {
      version: "1.0", hotkey: "Ctrl+Alt+S", device_name: "My-Laptop", searching: false, tvs: [],
      settings: { res: "1080p", fps: 60, quality: "high", audio_mode: "tv", fill: true, last_tv: "192.168.1.50", manual_ip: "" },
      status: { state: "idle", message: "", tv_name: "", fps: 0, mbps: 0, encoder: "" },
    };
    let timer = null;
    const push = () => window.sharek.onState(JSON.parse(JSON.stringify(m)));
    const set = (o) => { Object.assign(m.status, o); push(); };
    const jump = params.get("state");
    if (jump) {
      m.tvs = tvs;
      Object.assign(m.status, { state: jump, tv_name: tvs[0].name, fps: 60, mbps: 11.8, encoder: "h264_qsv",
        message: jump === "error" ? "ما قدرنا نوصل للتلفزيون" : "" });
    }
    return {
      get_state: async () => JSON.parse(JSON.stringify(m)),
      search: async () => { m.searching = true; push(); setTimeout(() => { m.searching = false; m.tvs = tvs; push(); }, 1200); },
      start: async (ip) => {
        const name = (tvs.find((t) => t.ip === ip) || {}).name || ip;
        set({ state: "connecting", tv_name: name });
        setTimeout(() => set({ state: "waiting_approval" }), 900);
        setTimeout(() => {
          set({ state: "streaming", encoder: "h264_qsv" });
          timer = setInterval(() => set({ fps: 58 + Math.random() * 2.5, mbps: 9 + Math.random() * 4 }), 1000);
        }, 3200);
      },
      stop: async () => { clearInterval(timer); set({ state: "idle", fps: 0, mbps: 0 }); },
      reset: async () => set({ state: "idle", message: "" }),
      set_setting: async (k, v) => { m.settings[k] = v; },
      minimize: async () => {}, hide: async () => {},
    };
  }

  if (window.pywebview?.api?.get_state) boot(window.pywebview.api);
  else window.addEventListener("pywebviewready", () => boot(window.pywebview.api));
  setTimeout(() => {
    if (!api) { const m = mockApi(); boot(m).then(() => { if (!params.get("state")) m.search(); }); }
  }, 400);
})();
</script>
</body>
</html>
